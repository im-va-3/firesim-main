version: 2

# note: dependabot PRs have their own sets of secrets (they can't use the GH-A secrets)
updates:
  # Submit a PR for bumping GitHub Actions dependencies. Submodule updates are
  # intentionally omitted in this consolidated snapshot because its upstream
  # submodule branches are not maintained by this repository.
  - package-ecosystem: github-actions
    schedule:
      interval: "weekly"
    directory: /
    labels:
      - "dependencies"
      - "changelog:omit"
